# Nginx reverse proxy config for the bulk-email production deploy, following
# the same infra/nginx/ convention as CrewOS on this VPS: version-controlled
# here, scp'd to the server, symlinked into sites-enabled.
#
# This is the PRE-CERTBOT version — plain HTTP (port 80) reverse proxies for
# all three subdomains, plus the ACME HTTP-01 challenge location certbot
# needs to issue the certs. After `certbot --nginx` runs against this file
# (see docs/DEPLOYMENT.md), certbot rewrites it in place on the VPS to add
# the HTTPS server blocks and the http->https redirect — that edited version
# is NOT synced back into this repo. If you need to change proxy behavior
# later, edit this file, scp it again, and re-run certbot's `--nginx`
# install step (or manually re-add the SSL directives) rather than hand-
# editing the VPS copy and letting it drift from what's committed here.
#
# One-time setup on the VPS:
#   scp infra/nginx/bulkmail-production.conf <vps>:/etc/nginx/sites-available/bulkmail-production.conf
#   ssh <vps> "sudo ln -s /etc/nginx/sites-available/bulkmail-production.conf /etc/nginx/sites-enabled/"
#   ssh <vps> "sudo nginx -t && sudo systemctl reload nginx"
#   ssh <vps> "sudo certbot --nginx -d bulkmail.okwiyatech.co.ke -d admin.bulkmail.okwiyatech.co.ke -d bulkmailapi.okwiyatech.co.ke"
#
# Ports below (3200 frontend / 3001 admin / 4500 api) match API_PORT /
# FRONTEND_PORT / ADMIN_PORT in .env.production.example — if those ever
# change, update both together.

# --- Customer frontend: bulkmail.okwiyatech.co.ke ---
server {
    listen 80;
    listen [::]:80;
    server_name bulkmail.okwiyatech.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin dashboard: admin.bulkmail.okwiyatech.co.ke ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.bulkmail.okwiyatech.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API: bulkmailapi.okwiyatech.co.ke ---
server {
    listen 80;
    listen [::]:80;
    server_name bulkmailapi.okwiyatech.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SNS posts to /webhooks/ses with a large-ish JSON body and expects a
    # timely 200 — keep body size generous and don't buffer/transform it.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
